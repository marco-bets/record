<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing · Book Buster</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1570ef">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* top bar: the one title on every page */
  .sitenav { position: sticky; top: 0; z-index: 20; background: #1570ef; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
  .sitenav .in { max-width: 880px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 2px; height: 56px; }
  .sitenav .brand { font: 800 1.2rem/1 "Inter", system-ui, sans-serif; color: #fff; text-decoration: none; letter-spacing: -.02em;
                    margin-right: auto; white-space: nowrap; display: block; }
  .sitenav .tab { color: rgba(255,255,255,.78); text-decoration: none; font: 600 .9rem/1 "Inter", system-ui, sans-serif;
                  padding: 20px 9px 17px; border-bottom: 3px solid transparent; white-space: nowrap; }
  .sitenav .tab:hover { color: #fff; }
  .sitenav .tab[aria-current="page"] { color: #fff; border-bottom-color: #fff; }
  .sitenav .login { margin-left: 8px; font: 700 .85rem/1 "Inter", system-ui, sans-serif; color: #1570ef; background: #fff;
                    text-decoration: none; padding: 9px 13px; border-radius: 999px; white-space: nowrap; }
  .sitenav .login.out { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.7); }
  .sitenav a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @media (max-width: 400px) { .sitenav .brand { font-size: 1.05rem; } .sitenav .tab { padding-left: 6px; padding-right: 6px; font-size: .84rem; } }
  :root {
    --bg: #eef1f5; --card: #ffffff; --ink: #0f1b2d; --muted: #5d6b7e; --line: #e2e7ee; --soft: #f4f6f9;
    --blue: #1570ef; --blue-soft: #e9f2fe; --win: #0f8a43; --win-soft: #e4f6eb; --loss: #d1342f; --loss-soft: #fdeceb;
    --shadow: 0 1px 2px rgba(15,27,45,.06), 0 2px 8px rgba(15,27,45,.05);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* league bar, like a sportsbook's sport menu */
  .leagues { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 56px; z-index: 10; }
  .leagues .in { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .leagues .in::-webkit-scrollbar { display: none; }
  .leagues button { flex: none; font: 600 .88rem var(--font); color: var(--ink); background: var(--soft); border: 1px solid var(--line);
                    border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .leagues button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

  main { max-width: 880px; margin: 0 auto; padding: 16px 16px 64px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 700; }
  .meta { color: var(--muted); font-size: .82rem; margin: 0; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 12px; min-width: 0; }
  .stat span { display: block; color: var(--muted); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .stat b { display: block; font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .stat b.pos { color: var(--win); } .stat b.neg { color: var(--loss); }
  .chart svg { display: block; width: 100%; height: 170px; }

  table.split { width: 100%; border-collapse: collapse; }
  .split th, .split td { text-align: left; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .split tr:last-child td { border-bottom: 0; }
  .split th { color: var(--muted); font-weight: 600; font-size: .78rem; }
  .split td:not(:first-child), .split th:not(:first-child) { text-align: right; }
  .split td.pos { color: var(--win); font-weight: 700; } .split td.neg { color: var(--loss); font-weight: 700; }

  .types { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .types button { font: 600 .8rem var(--font); color: var(--muted); background: #fff; border: 1px solid var(--line);
                  border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .types button[aria-pressed="true"] { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }

  /* picks look like settled bet slips */
  ol.ledger { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .slip { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .slip .what { font-weight: 700; font-size: 1rem; }
  .slip .tag { display: inline-block; margin-left: 6px; font-size: .7rem; font-weight: 700; color: var(--blue); background: var(--blue-soft);
               padding: 2px 7px; border-radius: 999px; vertical-align: 2px; }
  .slip .sub { color: var(--muted); font-size: .83rem; grid-column: 1; }
  .res { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px; }
  .win .pill { color: var(--win); background: var(--win-soft); } .loss .pill { color: var(--loss); background: var(--loss-soft); }
  .push .pill { color: var(--muted); background: var(--soft); }
  .u { display: block; font-weight: 800; font-size: 1.05rem; margin-top: 4px; }
  .win .u { color: var(--win); } .loss .u { color: var(--loss); } .push .u { color: var(--muted); }
  .empty { color: var(--muted); margin: 0; }
  footer { color: var(--muted); font-size: .76rem; max-width: 70ch; padding: 4px 2px; }

  @media (max-width: 560px) {
    .summary { grid-template-columns: 1fr 1fr; }
    .summary .stat:first-child { grid-column: 1 / -1; }
  }

  /* signed-in pages stay hidden until the login check finishes (no flash of content) */
  body[data-gate]:not(.ok) > :not(nav) { visibility: hidden; }

  .lock { max-width: 420px; margin: 24px auto; display: flex; flex-direction: column; gap: 12px; }
  .lock input { font: 16px var(--font); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); }
  .lock input:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .lock button, .btn { font: 700 1rem var(--font); color: #fff; background: var(--blue); border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
  .err { color: var(--loss); margin: 0; font-size: .9rem; }
  .prog { display: grid; gap: 8px; }
  .prog .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 10px 12px; background: var(--soft); border-radius: 10px; }
  .prog .row b { font-size: .95rem; }
  .prog .row span { color: var(--muted); font-size: .82rem; text-align: right; }
  .state { font-size: .7rem; font-weight: 800; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; margin-left: 6px; }
  .state.testing { color: #8a5a00; background: #fdf3dc; } .state.SENDING { color: var(--win); background: var(--win-soft); }
  .pending .pill { color: #8a5a00; background: #fdf3dc; } .pending .u { color: var(--muted); }
  .note { color: var(--muted); font-size: .78rem; margin-top: 4px; grid-column: 1 / -1; }
  .slip .sub { grid-column: 1 / -1; }
  [hidden] { display: none !important; }
  .private { display: inline-block; font-size: .72rem; font-weight: 800; color: var(--loss); background: var(--loss-soft); padding: 3px 9px; border-radius: 999px; }
</style>
</head>
<body>
<nav class="sitenav" aria-label="Site"><div class="in"><a class="brand" href="bankroll.html">Book Buster</a><a class="tab" href="bankroll.html">My Bankroll</a><a class="tab" href="record.html">Record</a><a class="tab" href="testing.html" aria-current="page">Testing</a></div></nav>
<div class="leagues" id="lbar" hidden><div class="in" id="leagues" role="group" aria-label="League"></div></div>
<main>
  <h1 class="sr">Testing (private)</h1>
  <section class="card lock" id="lock">
    <span class="private">🔒 PRIVATE</span>
    <h2 style="margin:0">Testing</h2>
    <p class="meta" style="margin:0">Everything the bot tracks silently before it's allowed to send. Only you can open this.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button id="go" type="button">Unlock</button>
    <p class="err" id="err" hidden></p>
  </section>
  <p class="meta" id="meta" hidden></p>
  <div id="view"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmtU = u => (u >= 0 ? "+" : "−") + Math.abs(u).toFixed(1) + "u";
const dt = s => new Date(s);
const day = d => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const time = d => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let FILE, DATA, LEAGUE = "All";

async function unlock(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(FILE.salt), iterations: FILE.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(FILE.iv) }, key, b64(FILE.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function draw() {
  const leagues = [...new Set(DATA.bets.map(b => b.sport))];
  $("lbar").hidden = false;
  $("leagues").innerHTML = ["All", ...leagues].map(l => `<button type="button" aria-pressed="${l === LEAGUE}">${esc(l)}</button>`).join("");
  const bets = DATA.bets.filter(b => LEAGUE === "All" || b.sport === LEAGUE);
  const groups = {};
  for (const b of bets) (groups[b.group] ??= []).push(b);
  const rows = Object.entries(groups).map(([k, g]) => {
    const w = g.filter(b => b.result === "win").length, l = g.filter(b => b.result === "loss").length;
    const p = g.filter(b => b.result === "pending").length, u = g.reduce((s, b) => s + b.units, 0);
    return `<tr><td>${esc(k)}</td><td>${w}-${l}</td><td>${w + l ? Math.round(w / (w + l) * 100) + "%" : "n/a"}</td>` +
           `<td class="${u > 0 ? "pos" : u < 0 ? "neg" : ""}">${fmtU(u)}</td><td>${p}</td></tr>`;
  }).join("");
  $("view").innerHTML = `
    <section class="card"><h2>Proving progress</h2><div class="prog">${DATA.progress.map(p =>
      `<div class="row"><b>${esc(p.name)}<span class="state ${esc(p.state)}">${p.state === "SENDING" ? "SENDING" : "TESTING"}</span></b><span>${esc(p.detail)}</span></div>`).join("")}</div></section>
    <section class="card" style="margin-top:14px"><h2>By type (tracked silently)</h2>
      ${rows ? `<table class="split"><thead><tr><th scope="col">Type</th><th scope="col">Record</th><th scope="col">Win rate</th><th scope="col">Units</th><th scope="col">Pending</th></tr></thead><tbody>${rows}</tbody></table>`
             : `<p class="empty">Nothing tracked yet. Silent picks show up here the moment the bot saves them.</p>`}</section>
    <section class="card" style="margin-top:14px"><h2>Every tracked pick</h2><ol class="ledger">${bets.map(b => {
      const s = dt(b.start);
      return `<li class="slip ${b.result}">
        <div class="what">${esc(b.bet)}<span class="tag">${esc(b.sport)}</span></div>
        <div class="res"><span class="pill">${b.result === "win" ? "WON" : b.result === "loss" ? "LOST" : b.result === "push" ? "PUSH" : "PENDING"}</span>${b.result === "pending" ? "" : `<span class="u">${fmtU(b.units)}</span>`}</div>
        <div class="sub">${esc(b.game)}${b.final ? " · Final " + esc(b.final) : ""} · ${day(s)} ${time(s)}</div>
        <div class="sub">${esc(b.group)} · ${esc(b.book)}${b.ev != null ? ` · edge ${(b.ev * 100).toFixed(1)}%` : ""}${b.close_ev != null ? ` · closing value ${(b.close_ev * 100).toFixed(1)}%` : ""}</div>
        <div class="note">${esc(b.note)}</div></li>`;
    }).join("")}</ol></section>`;
}

async function go() {
  $("err").hidden = true;
  try {
    DATA = await unlock($("pw").value);
  } catch (e) {
    $("err").textContent = "Wrong password."; $("err").hidden = false; return;
  }
  $("lock").hidden = true;
  $("meta").hidden = false;
  $("meta").textContent = `Updated ${day(dt(DATA.updated))} at ${time(dt(DATA.updated))}. Only you can see this page.`;
  draw();
}

$("leagues").addEventListener("click", e => { if (e.target.tagName === "BUTTON") { LEAGUE = e.target.textContent; draw(); } });
$("go").addEventListener("click", go);
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
fetch("testing.json", { cache: "no-store" }).then(r => r.json()).then(f => {
  FILE = f;
  if (!f.data) { $("pw").disabled = $("go").disabled = true; $("err").textContent = "Not set up yet: add TESTING_PASSWORD to .env, then run python3 publish.py."; $("err").hidden = false; }
}).catch(() => { $("err").textContent = "Couldn't load. Refresh in a minute."; $("err").hidden = false; });
</script>
</body>
</html>
