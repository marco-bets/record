<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing · Book Buster</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1570ef">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5; --card: #fff; --ink: #0f1b2d; --muted: #5d6b7e; --line: #e2e7ee; --soft: #f4f6f9;
    --blue: #1570ef; --blue-soft: #e9f2fe; --win: #0f8a43; --win-soft: #e4f6eb; --loss: #d1342f; --loss-soft: #fdeceb;
    --amber: #8a5a00; --amber-soft: #fdf3dc; --grey-soft: #eceff3;
    --shadow: 0 1px 2px rgba(15,27,45,.06), 0 2px 8px rgba(15,27,45,.05);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .sitenav { position: sticky; top: 0; z-index: 20; background: var(--blue); }
  .sitenav .in { max-width: 880px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 2px; height: 56px; overflow-x: auto; scrollbar-width: none; }
  .sitenav .in::-webkit-scrollbar { display: none; }
  .sitenav .brand { font: 800 1.2rem/1 var(--font); color: #fff; text-decoration: none; letter-spacing: -.02em; margin-right: auto; white-space: nowrap; }
  .sitenav .tab { color: rgba(255,255,255,.78); text-decoration: none; font: 600 .9rem/1 var(--font); padding: 20px 9px 17px; border-bottom: 3px solid transparent; white-space: nowrap; }
  .sitenav .tab[aria-current="page"] { color: #fff; border-bottom-color: #fff; }

  main { max-width: 880px; margin: 0 auto; padding: 18px 16px 64px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 1.02rem; margin: 0; }
  .meta { color: var(--muted); font-size: .82rem; margin: 0; }
  .private { display: inline-block; font-size: .72rem; font-weight: 800; color: var(--loss); background: var(--loss-soft); padding: 3px 9px; border-radius: 999px; }

  .lock { display: flex; flex-direction: column; gap: 12px; max-width: 420px; margin: 40px auto 0; width: 100%; }
  .lock input { font: 16px var(--font); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
  .lock button { font: 700 1rem var(--font); color: #fff; background: var(--blue); border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
  .err { color: var(--loss); font-size: .85rem; margin: 0; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 13px; font-size: .82rem; font-weight: 600; }
  .pill b { font-weight: 800; }

  .section-title { font-size: .75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 2px -4px; }
  .play { display: flex; flex-direction: column; gap: 12px; }
  .play .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .badge { flex: none; font-size: .7rem; font-weight: 800; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .b-send { color: var(--win); background: var(--win-soft); }
  .b-wait { color: var(--amber); background: var(--amber-soft); }
  .b-track { color: var(--blue); background: var(--blue-soft); }
  .b-off { color: var(--muted); background: var(--grey-soft); }
  .rule { font-size: .88rem; margin: 0; }
  .where { font-size: .78rem; color: var(--muted); margin: 2px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .stat span { display: block; color: var(--muted); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .stat b { font-size: 1.05rem; }
  .pos { color: var(--win); } .neg { color: var(--loss); }
  .bt { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin: 0; }
  .bt b { color: var(--ink); }

  .list { list-style: none; margin: 10px 0 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .list li:first-child { border-top: 0; }
  .res { font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; }
  .r-win { color: var(--win); background: var(--win-soft); } .r-loss { color: var(--loss); background: var(--loss-soft); }
  .r-pending, .r-push, .r-void { color: var(--muted); background: var(--grey-soft); }
  .when { color: var(--muted); font-size: .78rem; display: block; }
</style>
</head>
<body>
<nav class="sitenav" aria-label="Site"><div class="in"><a class="brand" href="bankroll.html">Book Buster</a><a class="tab" href="bankroll.html">My Bankroll</a><a class="tab" href="record.html">Record</a><a class="tab" href="testing.html" aria-current="page">Testing</a></div></nav>
<main>
  <section class="card lock" id="lock">
    <span class="private">🔒 ADMIN ONLY</span>
    <h1>Testing</h1>
    <p class="meta">What's sending to members, what's being tested, and how each one is doing.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button id="go" type="button">Unlock</button>
    <p class="err" id="err" hidden></p>
  </section>
  <div id="view" hidden></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const when = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
let FILE;

async function unlock(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(FILE.salt), iterations: FILE.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(FILE.iv) }, key, b64(FILE.data))));
}

function badge(s) {
  const cls = s === "SENDING" ? "b-send" : s === "TRACKED" || s === "RESEARCH" ? "b-track" : s === "NOT RUN" ? "b-off" : "b-wait";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}

function stat([lab, val]) {
  const cls = /^\+/.test(val) ? "pos" : /^[-−]\d/.test(val) ? "neg" : "";
  return `<div class="stat"><span>${esc(lab)}</span><b class="${cls}">${esc(val)}</b></div>`;
}

function card(p) {
  return `<section class="card play">
    <div class="head"><div><h2>${esc(p.name)}</h2><p class="where">${esc(p.where)}</p></div>${badge(p.status)}</div>
    <p class="rule">${esc(p.rule)}</p>
    ${p.stats && p.stats.length ? `<div class="stats">${p.stats.map(stat).join("")}</div>` : ""}
    <p class="bt"><b>Backtest / evidence:</b> ${esc(p.backtest)}</p>
  </section>`;
}

function draw(D) {
  const sending = D.plays.filter(p => p.status === "SENDING");
  const rest = D.plays.filter(p => p.status !== "SENDING");
  $("view").innerHTML = `
    <div class="top"><div><h1>Testing</h1><p class="meta">Updated ${esc(when(D.updated))}</p></div>
      <div class="pills"><span class="pill">Sending: <b>${sending.length}</b></span><span class="pill">Credits left: <b>${esc(D.credits_left ?? "n/a")}</b></span></div></div>
    <p class="section-title">✅ Sending to members</p>
    ${sending.map(card).join("") || `<section class="card"><p class="meta">Nothing is sending right now.</p></section>`}
    <p class="section-title">🧪 Tracking and testing (members don't see these)</p>
    ${rest.map(card).join("")}
    <p class="section-title">🕑 Latest sent to members</p>
    <section class="card">${(D.recent || []).length ? `<ul class="list">${D.recent.map(r => `<li><div>${esc(r.what)}<span class="when">${esc(when(r.ts))}</span></div><span class="res r-${esc(r.result)}">${esc(r.result)}</span></li>`).join("")}</ul>`
      : `<p class="meta">Nothing sent yet.</p>`}</section>`;
  $("lock").hidden = true;
  $("view").hidden = false;
}

async function go() {
  $("err").hidden = true;
  try {
    if (!FILE) FILE = await (await fetch("testing.json?ts=" + Date.now(), { cache: "no-store" })).json();
    if (FILE.enabled === false || !FILE.data) throw new Error("off");
    const D = await unlock($("pw").value);
    try { sessionStorage.setItem("bb-testing", $("pw").value); } catch (e) {}
    draw(D);
  } catch (e) {
    $("err").textContent = String(e.message) === "off" ? "The testing page isn't published yet." : "Wrong password.";
    $("err").hidden = false;
  }
}
$("go").onclick = go;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
try { const s = sessionStorage.getItem("bb-testing"); if (s) { $("pw").value = s; go(); } } catch (e) {}
</script>
</body>
</html>
